<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Pronounciation</title>

    <style>
        body {
            margin: 0;
            height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            font-family: Arial, sans-serif;

        }

        .container{
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            justify-content: center;
            gap: 25px;
        }

        .letter{
            width: 100px;
            height: 100px;
            background: #fff;
            color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;

        }

        .letter:hover{
            transform: scale(1.1);
            background: #91fde8;
        }

    </style>
</head>
<body onkeydown="playFromKeyboard(event)">
    

    <div class="container">
        <div class="letter" onclick="playSound('a')">A</div>
        <div class="letter" onclick="playSound('d')">D</div>
        <div class="letter" onclick="playSound('e')">E</div>
        <div class="letter" onclick="playSound('r')">R</div>
    </div>

    <script>
        function playSound(letter){
            const audio = new Audio(letter + ".mp3");
            audio.play();
        }

        function playFromKeyboard(event){
             const key = event.key.toLowerCase();

             if (key === "a" || key === "d" || key === "e"|| key === "r") {
                playSound(key);
            }
            
                
        }
    </script>
    
</body>
</html>
